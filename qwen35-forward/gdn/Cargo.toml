[package]
name = "gdn"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Qwen3.5 gated delta net block, checked against the golden bundle"

[[bin]]
name = "gdncheck"
path = "src/main.rs"

[[bin]]
name = "qwenrun"
path = "src/bin/qwenrun.rs"

[[bin]]
name = "tokcheck"
path = "src/bin/tokcheck.rs"

[[bin]]
name = "chatcheck"
path = "src/bin/chatcheck.rs"

[[bin]]
name = "samplecheck"
path = "src/bin/samplecheck.rs"

[dependencies]
goldenbundle = { path = "../bundle" }
deltarule = { path = "../delta" }
shell-text = { path = "../../shell/crates/shell-text" }
serde_json = "1"
